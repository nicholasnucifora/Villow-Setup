[package]
name = "villow-setup"
version = "0.2.0"
description = "Local owner-operated setup for Villow"
license = "MIT"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "villow_setup"
crate-type = ["rlib"]

[[bin]]
name = "villow-setup"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:open", "dep:rfd"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = [] }
open = { version = "5", optional = true }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }
ring = "0.17.14"
tempfile = "3"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
