name: Verify renewal automation
on:
  push:
    paths:
      - 'release-automation/**'
      - '.github/workflows/app-channel-*.yml'
  pull_request:
    paths:
      - 'release-automation/**'
      - '.github/workflows/app-channel-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Test renewal and publication verification with disposable keys
        run: node --test release-automation/tests/*.checks.mjs
